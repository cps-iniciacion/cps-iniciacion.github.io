<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="Georgia, 'Times New Roman', serif">
<rect x="0" y="0" width="760" height="420" rx="10" fill="#fbfaf7" stroke="#e2ddd3"/>
<text x="30" y="40" font-size="19" fill="#1a1a1a">La complejidad es una medida continua, no discreta</text>
<text x="30" y="63" font-size="12.5" fill="#666">Y por eso está sometida a la paradoja de Sorites: no hay un grano de arena que convierta el montón en montón.</text>

<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#4a6670"/>
    <stop offset="48%" stop-color="#8c4a3f"/>
    <stop offset="100%" stop-color="#a89a86"/>
  </linearGradient>
</defs>

<rect x="60" y="96" width="640" height="16" rx="8" fill="url(#g)"/>
<text x="60" y="136" font-size="13" fill="#3a5560">Orden organizado</text>
<text x="380" y="136" font-size="13" fill="#8c4a3f" text-anchor="middle">Complejidad estructurada</text>
<text x="700" y="136" font-size="13" fill="#7a7268" text-anchor="end">Desorden aleatorio</text>

<text x="380" y="170" font-size="12.5" fill="#666" text-anchor="middle" font-style="italic">¿dónde acaba lo complicado y empieza lo complejo? no hay línea</text>

<line x1="60" y1="196" x2="700" y2="196" stroke="#e2ddd3"/>

<text x="30" y="228" font-size="14" fill="#1a1a1a">Dos maneras de trazar esa frontera, y sus límites</text>

<g>
  <rect x="30" y="244" width="212" height="106" rx="8" fill="#f3ede2" stroke="#ddd3c2"/>
  <text x="136" y="270" text-anchor="middle" font-size="13.5" fill="#8c4a3f">Watanabe</text>
  <text x="136" y="292" text-anchor="middle" font-size="11.5" fill="#6a5a4a">descomponer lo complejo</text>
  <text x="136" y="308" text-anchor="middle" font-size="11.5" fill="#6a5a4a">en problemas simples</text>
  <text x="136" y="332" text-anchor="middle" font-size="11" fill="#a06858" font-style="italic">«CPS para niños»</text>

  <rect x="256" y="244" width="212" height="106" rx="8" fill="#eef1f0" stroke="#c9d4d2"/>
  <text x="362" y="270" text-anchor="middle" font-size="13.5" fill="#3a5560">Cynefin</text>
  <text x="362" y="292" text-anchor="middle" font-size="11.5" fill="#5a6a70">cuatro dominios con</text>
  <text x="362" y="308" text-anchor="middle" font-size="11.5" fill="#5a6a70">fronteras delimitadas</text>
  <text x="362" y="332" text-anchor="middle" font-size="11" fill="#6e838a" font-style="italic">eye-opener, pero simplifica</text>

  <rect x="482" y="244" width="248" height="106" rx="8" fill="#8c4a3f"/>
  <text x="606" y="270" text-anchor="middle" font-size="13.5" fill="#fff">No separabilidad</text>
  <text x="606" y="292" text-anchor="middle" font-size="11.5" fill="#f0dcd6">los problemas no son factorizables:</text>
  <text x="606" y="308" text-anchor="middle" font-size="11.5" fill="#f0dcd6">se realimentan y se condicionan</text>
  <text x="606" y="332" text-anchor="middle" font-size="11" fill="#ffd9cc" font-style="italic">corriges uno y aparecen tres</text>
</g>

<rect x="30" y="366" width="700" height="38" rx="8" fill="#eef1f0" stroke="#c9d4d2"/>
<text x="50" y="391" font-size="12.5" fill="#3a5560" font-style="italic">La complejidad de Kolmogórov, la medida que todo el mundo usa, mide en realidad aleatoriedad.</text>
</svg>
