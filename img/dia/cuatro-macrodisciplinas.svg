<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" height="520" font-family="Georgia, 'Times New Roman', serif">
<rect x="0" y="0" width="760" height="520" rx="10" fill="#fbfaf7" stroke="#e2ddd3"/>
<text x="30" y="40" font-size="19" fill="#1a1a1a">No hay «el libro del CPS» porque el CPS no es una disciplina vertical</text>
<text x="30" y="62" font-size="12.5" fill="#666">Es la superposición de cuatro macrodisciplinas. Cualquier buen libro que caiga en una de ellas sirve. Si cae en varias, mejor.</text>

<rect x="30" y="82" width="700" height="286" rx="12" fill="#f6f1e8" stroke="#ddd3c2" stroke-dasharray="5 4"/>
<text x="380" y="104" text-anchor="middle" font-size="12" fill="#a08a70" font-style="italic">todas atravesadas por los cinco atractores</text>

<g>
  <rect x="58" y="122" width="292" height="94" rx="9" fill="#4a6670"/>
  <text x="204" y="152" text-anchor="middle" font-size="14.5" fill="#fff">Ciencias de la complejidad</text>
  <text x="204" y="176" text-anchor="middle" font-size="11.5" fill="#dbe6e9">sistemas no lineales, systems thinking,</text>
  <text x="204" y="194" text-anchor="middle" font-size="11.5" fill="#dbe6e9">emergencia, sensemaking</text>

  <rect x="410" y="122" width="292" height="94" rx="9" fill="#4a6670"/>
  <text x="556" y="152" text-anchor="middle" font-size="14.5" fill="#fff">Ecosistemas tecnológicos</text>
  <text x="556" y="176" text-anchor="middle" font-size="11.5" fill="#dbe6e9">data science, IoT, blockchain, IA:</text>
  <text x="556" y="194" text-anchor="middle" font-size="11.5" fill="#dbe6e9">el mapa de lo que hoy se puede hacer</text>

  <rect x="58" y="248" width="292" height="94" rx="9" fill="#8c4a3f"/>
  <text x="204" y="278" text-anchor="middle" font-size="14.5" fill="#fff">El Factor X</text>
  <text x="204" y="302" text-anchor="middle" font-size="11.5" fill="#f0dcd6">psicología, antropología, sociología,</text>
  <text x="204" y="320" text-anchor="middle" font-size="11.5" fill="#f0dcd6">etnografía — el factor humano</text>

  <rect x="410" y="248" width="292" height="94" rx="9" fill="#8c4a3f"/>
  <text x="556" y="278" text-anchor="middle" font-size="14.5" fill="#fff">Business Acumen</text>
  <text x="556" y="302" text-anchor="middle" font-size="11.5" fill="#f0dcd6">estrategia, propuesta de valor,</text>
  <text x="556" y="320" text-anchor="middle" font-size="11.5" fill="#f0dcd6">lectura de señales</text>

  <circle cx="380" cy="232" r="38" fill="#fbfaf7" stroke="#8a8272" stroke-width="1.4"/>
  <text x="380" y="228" text-anchor="middle" font-size="12.5" fill="#3a3a3a">CPS</text>
  <text x="380" y="245" text-anchor="middle" font-size="10" fill="#7a7268">Fringe Fut.</text>
</g>

<text x="30" y="404" font-size="13.5" fill="#1a1a1a">Dos ejemplos que él mismo coloca en el marco:</text>
<g font-size="12">
  <rect x="30" y="418" width="344" height="82" rx="8" fill="#eef1f0" stroke="#c9d4d2"/>
  <text x="50" y="442" font-size="13" fill="#3a5560">Charlie Munger</text>
  <text x="50" y="464" fill="#5a6a70">Business Acumen + Factor X + algo de tecnología.</text>
  <text x="50" y="482" fill="#5a6a70">De complejidad, nada. Dos macrodisciplinas y media.</text>

  <rect x="386" y="418" width="344" height="82" rx="8" fill="#f3ede2" stroke="#ddd3c2"/>
  <text x="406" y="442" font-size="13" fill="#8c4a3f">Giorgio Nardone</text>
  <text x="406" y="464" fill="#6a5a4a">Factor X y algo de Business Acumen. Ni tecnología</text>
  <text x="406" y="482" fill="#6a5a4a">ni complejidad: «casi periférico a mi framework».</text>
</g>
</svg>
