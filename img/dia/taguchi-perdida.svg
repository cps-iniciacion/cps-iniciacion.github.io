<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="Georgia, 'Times New Roman', serif">
<rect x="0" y="0" width="760" height="400" rx="10" fill="#fbfaf7" stroke="#e2ddd3"/>
<text x="30" y="40" font-size="19" fill="#1a1a1a">«Dentro de tolerancias» no es calidad. La pérdida empieza en cuanto te desvías.</text>

<line x1="110" y1="300" x2="660" y2="300" stroke="#8a8272" stroke-width="1.4"/>
<line x1="385" y1="300" x2="385" y2="90" stroke="#8a8272" stroke-width="1.4" stroke-dasharray="4 4"/>
<text x="385" y="322" text-anchor="middle" font-size="12" fill="#6a6252">objetivo</text>
<text x="205" y="322" text-anchor="middle" font-size="12" fill="#6a6252">límite inferior</text>
<text x="565" y="322" text-anchor="middle" font-size="12" fill="#6a6252">límite superior</text>
<line x1="205" y1="294" x2="205" y2="306" stroke="#8a8272"/>
<line x1="565" y1="294" x2="565" y2="306" stroke="#8a8272"/>
<text x="86" y="180" font-size="12" fill="#6a6252" transform="rotate(-90 86 180)" text-anchor="middle">pérdida</text>

<path d="M205 120 L205 300 L565 300 L565 120" fill="none" stroke="#4a6670" stroke-width="2" stroke-dasharray="6 4"/>
<text x="600" y="132" font-size="12" fill="#4a6670">modelo escalón</text>
<text x="600" y="150" font-size="11" fill="#7a8f96">bueno / malo</text>

<path d="M205 116 Q385 300 565 116" fill="none" stroke="#8c4a3f" stroke-width="2.6"/>
<text x="600" y="196" font-size="12" fill="#8c4a3f">función de pérdida</text>
<text x="600" y="214" font-size="11" fill="#a97a70">cuadrática, L = k(y − m)²</text>

<circle cx="520" cy="163" r="4.5" fill="#8c4a3f"/>
<path d="M516 168 L470 236" stroke="#c09a90" stroke-width="1.2"/>
<text x="466" y="252" font-size="11" fill="#8c4a3f" text-anchor="end">esta pieza pasa la inspección…</text>
<text x="466" y="268" font-size="11" fill="#8c4a3f" text-anchor="end">y ya está costando dinero</text>

<rect x="30" y="342" width="700" height="44" rx="8" fill="#eef1f0" stroke="#c9d4d2"/>
<text x="50" y="370" font-size="13" fill="#3a5560" font-style="italic">Diseño robusto: si no puedes quitar el ruido, ajusta lo controlable para que el ruido deje de importar.</text>
</svg>
